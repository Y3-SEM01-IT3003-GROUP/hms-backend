spring:
  application:
    name: hms

  datasource:
    url: jdbc:postgresql://localhost:5432/hms_db
    username: postgres
    password: slhira
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method

server:
  port: 8081

app:
  admin:
    username: admin
    email: admin@hospital.com
    password: Admin@123
    firstname: System
    lastname: Administrator
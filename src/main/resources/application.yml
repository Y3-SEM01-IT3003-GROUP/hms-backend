spring:
  application:
    name: hms

  datasource:
    url: jdbc:postgresql://localhost:5432/hms_db
    username: postgres
    password: Nethmi@2002
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false
    locations: classpath:db/migration

server:
  port: 8081